name: Build APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug & Release APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Locate and Rename APKs
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKs-Build-${{ github.run_number }}
          path: output_apk/*.apk
          retention-days: 30
